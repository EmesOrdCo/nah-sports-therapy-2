name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        # Deliberately no VITE_CONTACT_FORM_ENDPOINT here.
        #
        # The form posts to a Netlify Function, and Pages is static hosting:
        # there is no /api/enquiry on this deployment and there cannot be. Left
        # unset, the build ships without an endpoint and the form shows NJH's
        # email address instead — which is the truth on this host. Setting it
        # would replace an honest message with a form that looks live, posts
        # into a 404 and loses the enquiry.
        #
        # Netlify is the real deployment. This workflow is a preview.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
