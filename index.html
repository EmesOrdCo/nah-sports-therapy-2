<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Interactive Fibre Field</title>
  </head>
  <body>
    <main class="fibre-field" aria-label="Interactive fibre field">
      <div class="fibre-field__glow" aria-hidden="true"></div>
      <canvas class="fibre-field__canvas" aria-hidden="true"></canvas>

      <button class="palette-toggle" type="button" aria-label="Change colour palette">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5"></circle>
          <path
            d="M12 2.25v2M12 19.75v2M21.75 12h-2M4.25 12h-2M18.9 5.1l-1.42 1.42M6.52 17.48 5.1 18.9M18.9 18.9l-1.42-1.42M6.52 6.52 5.1 5.1"
          ></path>
        </svg>
      </button>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
