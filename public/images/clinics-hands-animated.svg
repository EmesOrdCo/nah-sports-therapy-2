<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Line drawing of hands-on soft tissue treatment to the shoulder within measured rings">
  <style>
    .trace {
      fill: none;
      stroke: #2d2b74;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: trace var(--dur, 1.25s) cubic-bezier(.4, 0, .15, 1) var(--delay, 0s) forwards;
    }

    .ring { stroke-width: 2.4; stroke-opacity: .42; }
    .ring--faint { stroke-width: 1.6; stroke-opacity: .22; }

    .guide {
      fill: none;
      stroke: #2d2b74;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 0.5 15;
      opacity: 0;
      animation: fade .9s ease var(--delay, 1s) forwards;
    }

    .node {
      fill: #2d2b74;
      opacity: 0;
      animation: pop .5s cubic-bezier(.2, .9, .3, 1.4) var(--delay, 2s) forwards;
    }

    .fig-wipe {
      transform-origin: 50% 0;
      transform: scaleY(0);
      animation: wipe 1.15s cubic-bezier(.4, 0, .15, 1) .55s forwards;
    }

    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: .34; } }
    @keyframes pop { to { opacity: .85; } }
    @keyframes wipe { to { transform: scaleY(1); } }

    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .guide { animation: none; opacity: .34; }
      .node { animation: none; opacity: .85; }
      .fig-wipe { animation: none; transform: scaleY(1); }
    }
  </style>

  <defs>
    <mask id="clinics-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
      <rect class="fig-wipe" x="0" y="0" width="1000" height="1000" fill="#fff" />
    </mask>
  </defs>

  <!-- Orbit rings -->
  <circle class="trace ring--faint" pathLength="1" style="--delay:.05s;--dur:1.4s" cx="500" cy="500" r="452" />
  <circle class="trace ring" pathLength="1" style="--delay:.15s;--dur:1.35s" cx="500" cy="500" r="430" />
  <circle class="trace ring" pathLength="1" style="--delay:.4s;--dur:1.25s" cx="500" cy="500" r="332" />

  <!-- Crosshair guides -->
  <line class="guide" style="--delay:1.1s" x1="34" y1="500" x2="966" y2="500" />
  <line class="guide" style="--delay:1.25s" x1="500" y1="46" x2="500" y2="954" />

  <!-- Figure line drawing, revealed top-to-bottom -->
  <image
    x="98" y="98" width="804" height="804"
    href="clinics-hands-linework.webp"
    preserveAspectRatio="xMidYMid meet"
    mask="url(#clinics-reveal)"
  />

  <!-- Nodes -->
  <circle class="node" style="--delay:2.05s" cx="500" cy="70" r="7" />
  <circle class="node" style="--delay:2.14s" cx="68" cy="500" r="6" />
  <circle class="node" style="--delay:2.23s" cx="932" cy="500" r="6" />
  <circle class="node" style="--delay:2.32s" cx="742" cy="262" r="6" />
  <circle class="node" style="--delay:2.41s" cx="300" cy="740" r="6" />
  <circle class="node" style="--delay:2.5s" cx="700" cy="740" r="6" />
</svg>
