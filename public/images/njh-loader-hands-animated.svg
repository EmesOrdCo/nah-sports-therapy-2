<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 341" role="img" aria-label="Two hands guiding a flowing movement line">
  <style>
    .trace {
      fill: none;
      stroke: white;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .flow {
      animation: draw 1s 80ms cubic-bezier(.65, 0, .35, 1) forwards;
    }

    .upper {
      animation: draw .85s 260ms cubic-bezier(.65, 0, .35, 1) forwards;
    }

    .lower {
      animation: draw .85s 560ms cubic-bezier(.65, 0, .35, 1) forwards;
    }

    .wordmark {
      animation: draw .45s 1.12s cubic-bezier(.65, 0, .35, 1) forwards;
    }

    .completion {
      opacity: 0;
      animation: complete 1ms 1.56s forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes complete {
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .trace { stroke-dashoffset: 0; animation: none; }
      .completion { opacity: 1; animation: none; }
    }
  </style>

  <defs>
    <mask id="line-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="429" height="341">
      <rect width="429" height="341" fill="black" />

      <path
        class="trace flow"
        pathLength="1"
        stroke-width="12"
        d="M222 8 C191 22 177 49 188 76 C198 98 225 112 235 137 C246 164 241 189 228 211"
      />

      <path
        class="trace upper"
        pathLength="1"
        stroke-width="12"
        d="M329 144 C307 133 291 125 279 104 C267 83 255 67 235 56 C226 51 218 46 214 50 C210 55 221 61 231 68"
      />
      <path
        class="trace upper"
        pathLength="1"
        stroke-width="11"
        d="M231 68 C245 78 256 91 264 103 C268 109 266 113 261 110 C252 101 243 90 234 83 C224 76 217 69 212 74 C208 79 217 86 225 92"
      />
      <path
        class="trace upper"
        pathLength="1"
        stroke-width="12"
        d="M225 92 C235 102 241 113 250 123 C261 135 277 141 295 149"
      />

      <path
        class="trace lower"
        pathLength="1"
        stroke-width="13"
        d="M109 124 C131 126 147 132 160 144 C172 155 176 171 185 184 C194 197 207 204 214 211 C218 216 213 221 207 218 C196 213 187 207 179 201"
      />
      <path
        class="trace lower"
        pathLength="1"
        stroke-width="11"
        d="M179 201 C188 207 199 211 207 214 C213 216 216 212 211 207 C203 200 195 194 191 187"
      />
      <path
        class="trace lower"
        pathLength="1"
        stroke-width="11"
        d="M191 187 C197 194 205 201 211 204 C217 207 220 202 216 198 C207 189 199 181 194 171"
      />
      <path
        class="trace lower"
        pathLength="1"
        stroke-width="11"
        d="M194 171 C201 179 208 186 213 188 C219 191 222 186 218 182 C208 171 200 162 195 153"
      />

      <path
        class="trace wordmark"
        pathLength="1"
        stroke-width="25"
        d="M165 290 H253"
      />

      <rect class="completion" width="429" height="341" fill="white" />
    </mask>
  </defs>

  <image
    width="429"
    height="341"
    href="njh-loader-hands.png"
    preserveAspectRatio="xMidYMid meet"
    mask="url(#line-reveal)"
  />
</svg>
