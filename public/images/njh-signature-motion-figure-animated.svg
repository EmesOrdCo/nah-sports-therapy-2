      <path class="trace body" pathLength="1" style="--delay:1.58s;--duration:1.05s" d="M666 240C657 297 660 353 647 410C637 452 642 496 663 535C676 558 688 581 688 608" />
      <path class="trace body" pathLength="1" style="--delay:1.66s;--duration:1.05s" d="M870 240C879 297 876 353 889 410C899 452 894 496 873 535C860 558 848 581 848 608" />
      <path class="trace detail" pathLength="1" style="--delay:1.75s;--duration:.75s" d="M675 259C710 278 738 281 768 281C798 281 826 278 861 259" />
      <path class="trace detail" pathLength="1" style="--delay:1.84s;--duration:.7s" d="M674 475C704 492 738 500 768 500C798 500 832 492 862 475" />
