      <ellipse class="trace body" pathLength="1" style="--delay:1.18s;--duration:.8s" cx="768" cy="105" rx="43" ry="58" />
      <path class="trace detail" pathLength="1" style="--delay:1.26s;--duration:.65s" d="M727 89C731 57 754 43 783 51C807 58 816 80 810 108" />
      <path class="trace body" pathLength="1" style="--delay:1.3s;--duration:.72s" d="M733 135C736 171 744 188 768 193C792 188 800 171 803 135" />
      <path class="trace body" pathLength="1" style="--delay:1.38s;--duration:.85s" d="M744 181L738 218C700 222 657 238 630 271" />
      <path class="trace body" pathLength="1" style="--delay:1.45s;--duration:.85s" d="M792 181L798 218C836 222 879 238 906 271" />

      <!-- Left and right outer contours -->
      <path class="trace body" pathLength="1" style="--delay:1.48s;--duration:1.15s" d="M630 271C608 311 603 365 600 420C596 475 586 534 596 579C600 598 611 613 626 620" />
