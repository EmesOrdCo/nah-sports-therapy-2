      <path class="trace body" pathLength="1" style="--delay:1.92s;--duration:1.2s" d="M848 608C862 650 859 711 855 765C852 813 856 871 866 918C870 942 862 966 846 971" />
      <path class="trace body" pathLength="1" style="--delay:2s;--duration:1.15s" d="M768 544C748 588 733 631 730 681C727 741 739 800 735 856C733 899 724 942 714 972" />
      <path class="trace body" pathLength="1" style="--delay:2.08s;--duration:1.15s" d="M768 544C788 588 803 631 806 681C809 741 797 800 801 856C803 899 812 942 822 972" />
      <path class="trace detail" pathLength="1" style="--delay:2.28s;--duration:.65s" d="M670 918C659 950 666 977 690 980C701 981 709 977 714 972" />
      <path class="trace detail" pathLength="1" style="--delay:2.34s;--duration:.65s" d="M866 918C877 950 870 977 846 980C835 981 827 977 822 972" />

      <!-- Signature sage movement path -->
      <path class="trace energy" pathLength="1" style="--delay:2.38s;--duration:1.15s" d="M826 218C803 257 756 295 742 342C727 393 769 421 789 463C813 514 782 560 760 604C733 657 739 718 764 770C780 804 785 861 777 929" />

      <!-- Nodes -->
      <circle class="node" style="--delay:3.03s" cx="291" cy="499" r="18" />
      <circle class="node" style="--delay:3.1s" cx="1246" cy="499" r="18" />
      <circle class="node" style="--delay:3.17s" cx="1070" cy="183" r="17" />
      <circle class="node" style="--delay:3.24s" cx="520" cy="705" r="17" />
      <circle class="node" style="--delay:3.31s" cx="826" cy="218" r="18" />
      <circle class="node" style="--delay:3.38s" cx="777" cy="929" r="17" />
      <rect class="completion" width="1536" height="1024" />
    </mask>
  </defs>

  <image
    width="1536"
    height="1024"
    href="njh-signature-motion-figure-transparent.png"
    preserveAspectRatio="xMidYMid meet"
    mask="url(#line-reveal)"
  />
</svg>
