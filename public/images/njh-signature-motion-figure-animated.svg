<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024">
  <style>
    .trace {
      fill: none;
      stroke: #fff;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: trace var(--duration, 1.1s) cubic-bezier(.42, 0, .18, 1) var(--delay, 0s) forwards;
    }

    .orbit {
      stroke-width: 76;
    }

    .guide {
      stroke-width: 68;
    }

    .body {
      stroke-width: 104;
    }

    .detail {
      stroke-width: 88;
    }

    .energy {
      stroke-width: 92;
    }

    .node {
      fill: #fff;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: node-in .45s cubic-bezier(.2, .8, .25, 1) var(--delay, 3s) forwards;
    }

    .completion {
      fill: #fff;
      opacity: 0;
      animation: complete .01s linear 3.85s forwards;
    }

    @keyframes trace {
      to { stroke-dashoffset: 0; }
    }

    @keyframes node-in {
      from { opacity: 0; transform: scale(.15); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes complete {
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .trace {
        animation: none;
        stroke-dashoffset: 0;
      }

      .node {
        animation: none;
        opacity: 1;
      }

      .completion {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <defs>
    <mask id="line-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024">
      <rect width="1536" height="1024" fill="#000" />
      <!-- Outer precision rings -->
      <path class="trace orbit" pathLength="1" style="--delay:.08s;--duration:1.2s" d="M291 500A477 477 0 0 1 661 54" />
      <path class="trace orbit" pathLength="1" style="--delay:.2s;--duration:1.15s" d="M715 39A477 477 0 0 1 1098 146" />
      <path class="trace orbit" pathLength="1" style="--delay:.32s;--duration:1.05s" d="M1137 179A477 477 0 0 1 1245 432" />
      <path class="trace orbit" pathLength="1" style="--delay:.44s;--duration:1.1s" d="M1247 503A477 477 0 0 1 1117 844" />
      <path class="trace orbit" pathLength="1" style="--delay:.56s;--duration:1.05s" d="M1078 878A477 477 0 0 1 851 969" />
      <path class="trace orbit" pathLength="1" style="--delay:.68s;--duration:1.1s" d="M791 975A477 477 0 0 1 443 842" />
      <path class="trace orbit" pathLength="1" style="--delay:.8s;--duration:1.05s" d="M407 806A477 477 0 0 1 291 574" />

      <!-- Secondary charcoal ring -->
      <path class="trace orbit" pathLength="1" style="--delay:.24s;--duration:1.1s" d="M347 499A421 421 0 0 1 672 94" />
      <path class="trace orbit" pathLength="1" style="--delay:.36s;--duration:1.05s" d="M845 85A421 421 0 0 1 1179 241" />
      <path class="trace orbit" pathLength="1" style="--delay:.48s;--duration:1s" d="M1209 286A421 421 0 0 1 1188 731" />
      <path class="trace orbit" pathLength="1" style="--delay:.6s;--duration:1.05s" d="M1155 770A421 421 0 0 1 850 909" />
      <path class="trace orbit" pathLength="1" style="--delay:.72s;--duration:1.05s" d="M689 910A421 421 0 0 1 378 741" />
      <path class="trace orbit" pathLength="1" style="--delay:.84s;--duration:1s" d="M350 695A421 421 0 0 1 347 499" />

      <!-- Sage and charcoal middle rings -->
      <path class="trace orbit" pathLength="1" style="--delay:.35s;--duration:1.15s" d="M399 499A369 369 0 0 1 679 145" />
      <path class="trace orbit" pathLength="1" style="--delay:.47s;--duration:1.05s" d="M842 139A369 369 0 0 1 1125 264" />
      <path class="trace orbit" pathLength="1" style="--delay:.59s;--duration:1.05s" d="M1154 307A369 369 0 0 1 1132 720" />
      <path class="trace orbit" pathLength="1" style="--delay:.71s;--duration:1.05s" d="M1098 756A369 369 0 0 1 842 860" />
      <path class="trace orbit" pathLength="1" style="--delay:.83s;--duration:1.05s" d="M681 854A369 369 0 0 1 454 709" />
      <path class="trace orbit" pathLength="1" style="--delay:.95s;--duration:1.05s" d="M425 665A369 369 0 0 1 399 499" />

      <!-- Inner alignment rings -->
      <path class="trace guide" pathLength="1" style="--delay:.72s;--duration:.95s" d="M510 499A258 258 0 0 1 651 270" />
      <path class="trace guide" pathLength="1" style="--delay:.82s;--duration:.9s" d="M884 269A258 258 0 0 1 1026 499" />
      <path class="trace guide" pathLength="1" style="--delay:.92s;--duration:.9s" d="M1026 499A258 258 0 0 1 892 723" />
      <path class="trace guide" pathLength="1" style="--delay:1.02s;--duration:.9s" d="M644 722A258 258 0 0 1 510 499" />
      <path class="trace guide" pathLength="1" style="--delay:.9s;--duration:.8s" d="M291 499H557" />
      <path class="trace guide" pathLength="1" style="--delay:1s;--duration:.8s" d="M979 499H1246" />

      <!-- Keep the figure absent while the surrounding system draws -->
      <rect x="580" y="32" width="376" height="960" fill="#000" />

