<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <style>
    .trace {
      fill: none;
      stroke: #1b3a8f;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: trace var(--dur, 1.25s) cubic-bezier(.4, 0, .15, 1) var(--delay, 0s) forwards;
    }

    .ring {
      stroke-width: 2.4;
      stroke-opacity: .5;
    }

    .ring--faint {
      stroke-width: 1.6;
      stroke-opacity: .28;
    }

    .guide {
      fill: none;
      stroke: #1b3a8f;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 0.5 15;
      opacity: 0;
      animation: fade .9s ease var(--delay, 1s) forwards;
    }

    .node {
      fill: #1b3a8f;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: pop .5s cubic-bezier(.2, .8, .25, 1) var(--delay, 2s) forwards;
    }

    .fig-wipe {
      transform: scaleY(0);
      transform-box: fill-box;
      transform-origin: center top;
      animation: wipe 1.35s cubic-bezier(.5, 0, .2, 1) .35s forwards;
    }

    @keyframes trace {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fade {
      to { opacity: .32; }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.2); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes wipe {
      to { transform: scaleY(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .guide { animation: none; opacity: .32; }
      .node { animation: none; opacity: 1; }
      .fig-wipe { animation: none; transform: scaleY(1); }
    }
  </style>

  <defs>
    <mask id="fig-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
      <rect class="fig-wipe" x="0" y="0" width="1000" height="1000" fill="#fff" />
    </mask>
  </defs>

  <!-- Orbit rings -->
  <circle class="trace ring--faint" pathLength="1" style="--delay:.05s;--dur:1.4s" cx="500" cy="500" r="452" />
  <circle class="trace ring" pathLength="1" style="--delay:.15s;--dur:1.35s" cx="500" cy="500" r="430" />
  <circle class="trace ring" pathLength="1" style="--delay:.4s;--dur:1.25s" cx="500" cy="500" r="332" />

  <!-- Crosshair guides -->
  <line class="guide" style="--delay:1.1s" x1="34" y1="500" x2="966" y2="500" />
  <line class="guide" style="--delay:1.25s" x1="500" y1="46" x2="500" y2="954" />

  <!-- Figure line drawing, revealed top-to-bottom -->
  <image
    x="90" y="70" width="820" height="820"
    href="pilates-figure-meditation-linework.png"
    preserveAspectRatio="xMidYMid meet"
    mask="url(#fig-reveal)"
  />

  <!-- Nodes -->
  <circle class="node" style="--delay:2.05s" cx="500" cy="70" r="7" />
  <circle class="node" style="--delay:2.14s" cx="68" cy="500" r="6" />
  <circle class="node" style="--delay:2.23s" cx="932" cy="500" r="6" />
  <circle class="node" style="--delay:2.32s" cx="742" cy="262" r="6" />
  <circle class="node" style="--delay:2.41s" cx="300" cy="740" r="6" />
  <circle class="node" style="--delay:2.5s" cx="700" cy="740" r="6" />
</svg>
